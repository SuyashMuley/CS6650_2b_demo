# Local observability stack (not deployed to AWS): the Product API + Prometheus + Grafana.
#   docker compose up --build
# Apple Silicon (native arm64 build, avoids emulation):
#   TARGET_ARCH=arm64 docker compose up --build
#
# API:        http://localhost:8080   (metrics at /metrics)
# Prometheus: http://localhost:9090
# Grafana:    http://localhost:3000   (anonymous access enabled; dashboard "Product API - RED")
services:
  app:
    build:
      context: ./src
      args:
        TARGET_ARCH: ${TARGET_ARCH:-amd64}
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
